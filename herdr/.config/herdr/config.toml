onboarding = false
[terminal]
# Match tmux splits by inheriting the active pane's working directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
reload_config = "prefix+r"
copy_mode = "prefix+["
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
last_pane = "prefix+backslash"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
zoom = "prefix+space"
previous_workspace = "prefix+("
next_workspace = "prefix+)"

[[keys.command]]
key = "prefix+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"
description = "navigate left (Neovim/Herdr)"

[[keys.command]]
key = "prefix+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"
description = "navigate down (Neovim/Herdr)"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"
description = "navigate up (Neovim/Herdr)"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
description = "navigate right (Neovim/Herdr)"

[theme]
name = "dracula"
auto_switch = false

[ui]
pane_borders = true
show_agent_labels_on_pane_borders = false

agent_panel_sort = "priority"
[ui.toast]
delivery = "off"
